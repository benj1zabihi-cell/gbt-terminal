<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>GBT TERMINAL | LIVE 2026</title>
    <style>
        body { background-color: #000; color: #d1d1d1; font-family: 'Courier New', monospace; margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; }
        .top-bar { background: #0a0a0a; border-bottom: 2px solid #333; padding: 10px 20px; display: flex; justify-content: space-between; color: #ff9900; font-weight: bold; }
        .main-layout { display: grid; grid-template-columns: 300px 1fr; flex: 1; gap: 5px; background: #111; }
        .sidebar { background: #050505; border-right: 1px solid #333; padding: 15px; display: flex; flex-direction: column; gap: 20px; }
        .chart-container { background: #000; position: relative; }
        .news-box { border: 1px solid #222; padding: 10px; font-size: 0.8em; line-height: 1.6; }
        .red-flash { color: #ff3333; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

<div class="top-bar">
    <div>GBT TERMINAL v3.0 | SYSTEM: <span style="color:#0f0">ONLINE</span></div>
    <div id="clock"></div>
</div>

<div class="main-layout">
    <div class="sidebar">
        <div class="news-box">
            <div style="color:#ff9900; margin-bottom:10px;">🔴 LIVE ALERTS</div>
            <div class="red-flash">! JPM CREDIT CRUNCH</div>
            <div>• HORMUZ MINING OPS</div>
            <div>• CPI DATA PRICED IN</div>
        </div>
        
        <div class="news-box">
            <div style="color:#ff9900; margin-bottom:10px;">MARKET SUMMARY</div>
            <div style="display:flex; justify-content:space-between;"><span>GOLD:</span> <span style="color:#0f0">$5,212</span></div>
            <div style="display:flex; justify-content:space-between;"><span>NASDAQ:</span> <span style="color:#f00">-1.52%</span></div>
            <div style="display:flex; justify-content:space-between;"><span>JPM:</span> <span style="color:#f00">-2.7%</span></div>
        </div>
    </div>

    <div class="chart-container">
        <div id="tradingview_main" style="height: 100%;"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
        <script type="text/javascript">
          new TradingView.widget({
            "autosize": true,
            "symbol": "TVC:GOLD",
            "interval": "60",
            "timezone": "Etc/UTC",
            "theme": "dark",
            "style": "1",
            "locale": "en",
            "enable_publishing": false,
            "hide_top_toolbar": false,
            "save_image": false,
            "container_id": "tradingview_main"
          });
        </script>
    </div>
</div>

<script>
    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString();
    }, 1000);
</script>

</body>
</html>
