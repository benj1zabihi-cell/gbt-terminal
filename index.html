<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>GBT ULTIMATE TERMINAL | v4.0 PRO</title>
    <style>
        :root { --bg: #000; --border: #1a1a1a; --gold: #ff9900; --text: #d1d1d1; }
        body, html { margin: 0; padding: 0; height: 100vh; background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; overflow: hidden; }
        .grid-container { display: grid; grid-template-columns: 350px 1fr 350px; grid-template-rows: 45px 1fr; height: 100vh; gap: 2px; background: var(--border); }
        .header-ticker { grid-column: 1 / -1; background: #050505; border-bottom: 1px solid var(--border); overflow: hidden; }
        .social-sidebar { grid-column: 1; background: #000; overflow-y: auto; border-right: 1px solid var(--border); }
        .chart-area { grid-column: 2; background: #000; position: relative; border-right: 1px solid var(--border); border-left: 1px solid var(--border); }
        .news-sidebar { grid-column: 3; background: #000; overflow: hidden; display: flex; flex-direction: column; }
        .section-label { background: #0a0a0a; color: var(--gold); font-size: 10px; padding: 5px 10px; border-bottom: 1px solid var(--border); text-transform: uppercase; letter-spacing: 1px; text-align: center; }
    </style>
</head>
<body>

<div class="grid-container">
    <div class="header-ticker">
        <div class="tradingview-widget-container">
            <div class="tradingview-widget-container__widget"></div>
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
            {
            "symbols": [
                {"proName": "FX_IDC:XAUUSD", "title": "GOLD"},
                {"proName": "FX_IDC:XAGUSD", "title": "SILVER"},
                {"proName": "NASDAQ:NDX", "title": "NASDAQ 100"},
                {"proName": "NYSE:JPM", "title": "JP MORGAN"},
                {"proName": "FX_IDC:USDTIRR", "title": "USD/IRR"},
                {"proName": "TVC:UKOIL", "title": "BRENT OIL"},
                {"proName": "BINANCE:BTCUSDT", "title": "BITCOIN"},
                {"proName": "BINANCE:ETHUSDT", "title": "ETHEREUM"},
                {"proName": "CME_MINI:ES1!", "title": "S&P 500"},
                {"proName": "FX:DXY", "title": "US DOLLAR INDEX"}
            ],
            "showSymbolLogo": true, "colorTheme": "dark", "isTransparent": true, "displayMode": "adaptive", "locale": "en"
            }
            </script>
        </div>
    </div>

    <div class="social-sidebar">
        <div class="section-label">X (Twitter) Feed</div>
        <div id="twitter-container" style="padding: 5px;">
            <a class="twitter-timeline" data-theme="dark" data-chrome="noheader nofooter noborders transparent" href="https://twitter.com/business"></a>
            <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
        </div>
    </div>

    <div class="chart-area">
        <div id="tradingview_main" style="height: 100%;"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
        <script type="text/javascript">
          new TradingView.widget({
            "autosize": true,
            "symbol": "TVC:GOLD",
            "interval": "60",
            "timezone": "Etc/UTC",
            "theme": "dark",
            "style": "1",
            "locale": "en",
            "toolbar_bg": "#000",
            "enable_publishing": true,
            "withdateranges": true,
            "hide_side_toolbar": false,
            "allow_symbol_change": true,
            "details": true,
            "hotlist": true,
            "calendar": true,
            "show_popup_button": true,
            "container_id": "tradingview_main"
          });
        </script>
    </div>

    <div class="news-sidebar">
        <div class="section-label">Live Market News Wire</div>
        <div class="tradingview-widget-container" style="height: 100%;">
            <div class="tradingview-widget-container__widget"></div>
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-timeline.js" async>
            {
            "feedMode": "all_symbols",
            "isTransparent": true,
            "displayMode": "regular",
            "width": "100%",
            "height": "100%",
            "colorTheme": "dark",
            "locale": "en"
            }
            </script>
        </div>
    </div>
</div>

</body>
</html>
