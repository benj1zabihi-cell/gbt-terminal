<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>GBT TERMINAL PRO | v10.0</title>
    <style>
        :root { --bg: #000; --gold: #ff9900; --border: #1a1a1a; }
        body, html { margin: 0; padding: 0; height: 100vh; background: var(--bg); color: #d1d1d1; font-family: tahoma; overflow: hidden; }
        
        /* چیدمان ۴ بخشی طبق درخواست */
        .grid-master { display: grid; grid-template-columns: 350px 1fr 350px; grid-template-rows: 1fr 250px; height: 100vh; gap: 3px; background: var(--border); }
        
        .news-section { grid-row: 1 / 3; grid-column: 1; background: #000; display: flex; flex-direction: column; } /* بخش 1 */
        .chart-section { grid-column: 2; grid-row: 1; background: #000; } /* بخش 2 */
        .calendar-section { grid-column: 2; grid-row: 2; background: #000; border-top: 2px solid var(--border); } /* بخش 3 */
        .iran-market-section { grid-column: 3; grid-row: 1 / 3; background: #000; display: flex; flex-direction: column; } /* بخش 4 */

        .label { background: #0a0a0a; color: var(--gold); font-size: 11px; padding: 8px; text-align: center; border-bottom: 1px solid var(--border); font-weight: bold; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

<div class="grid-master">
    <div class="news-section">
        <div class="label">1. اخبار فوری (LIVE WIRE)</div>
        <iframe src="https://www.widgets.investing.com/live-news-world?theme=darkTheme&roundedCorners=true&download=false&headlineColor=ff9900"></iframe>
    </div>

    <div class="chart-section">
        <div id="tv_chart" style="height: 100%;"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
        <script type="text/javascript">
            new TradingView.widget({
                "autosize": true, "symbol": "TVC:GOLD", "interval": "15", "timezone": "Asia/Tehran",
                "theme": "dark", "style": "1", "locale": "fa", "toolbar_bg": "#000",
                "enable_publishing": true, "withdateranges": true, "hide_side_toolbar": false,
                "allow_symbol_change": true, "container_id": "tv_chart",
                "enabled_features": ["countdown", "label_last_price_value_countdown"]
            });
        </script>
    </div>

    <div class="calendar-section">
        <div class="label">3. تقویم اقتصادی (تایم تهران)</div>
        <iframe src="https://sslecal2.investing.com?columns=exc_flags,exc_currency,exc_importance,exc_actual,exc_forecast,exc_previous&category=_main&importance=2,3&features=datepicker,timezone&countries=5&calType=day&timeZone=50&lang=1"></iframe>
    </div>

    <div class="iran-market-section">
        <div class="label">4. قیمت‌های بازار ایران (زنده)</div>
        <div style="height: 100px; border-bottom: 1px solid var(--border);">
            <iframe src="https://www.tgju.org/widgets/market-summary" style="filter: invert(1) hue-rotate(180deg);"></iframe>
        </div>
        <iframe src="https://cryptopanic.com/widgets/news/?bg_color=000000&font_family=sans-serif&header_bg_color=0a0a0a&header_text_color=ff9900&link_color=00b8ff&news_feed=all&text_color=d1d1d1&title=Market%20Pulse"></iframe>
    </div>
</div>

</body>
</html>
